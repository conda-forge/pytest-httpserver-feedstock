schema_version: 1

context:
  version: "1.2.1"

package:
  name: pytest-httpserver
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pytest-httpserver/pytest_httpserver-${{ version }}.tar.gz
  sha256: fbad14449e1acfacf24a4d6e2de3211a8654597f03e296af4a833b51836467bc

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - werkzeug >=2.0.0

tests:
  - files:
      source:
        - tests
    requirements:
      run:
        - pip
        - pytest >=7.1.3
        - requests >=2.28.1
        - toml
        - types-toml >=0.10.8
        - python ${{ python_min }}.*
    script:
      - python -m pip check
      - python -m pytest -v -ra tests -k 'not ipv6'

about:
  summary: pytest-httpserver is a httpserver for pytest
  description: |
    This library is designed to help to test http clients without contacting
    the real http server.  In other words, it is a fake http server which is
    accessible via localhost can be started with the pre-defined expected
    http requests and their responses.
  homepage: https://github.com/csernazs/pytest-httpserver
  repository: https://github.com/csernazs/pytest-httpserver
  documentation: https://pytest-httpserver.readthedocs.io/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - duncanmmacleod
